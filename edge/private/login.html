<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin sign in</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111827;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
  form{width:min(320px,90vw);display:grid;gap:12px}
  h1{font-size:1.25rem;margin:0}
  input,button{padding:12px 14px;border-radius:10px;font:inherit;border:1px solid #e5e7eb}
  input:focus{outline:2px solid #2563eb;outline-offset:1px}
  button{background:#111827;color:#fff;border:0;cursor:pointer}
  #err{color:#dc2626;font-size:14px;min-height:1.4em}
</style></head>
<body>
<form id="f"><h1>Admin</h1><input id="p" type="password" placeholder="Password" autofocus required><button>Sign in</button><div id="err" role="alert"></div></form>
<script>
  const $ = id => document.getElementById(id);
  $('f').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('p').value }) });
    if (r.ok) location.href = '/admin';
    else $('err').textContent = r.status === 429 ? 'Too many attempts. Wait a minute.' : 'Wrong password.';
  };
</script></body></html>
